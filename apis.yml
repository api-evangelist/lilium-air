aid: lilium-air
name: Lilium
description: >-
  Lilium was a German eVTOL aircraft developer building the Lilium Jet, a
  seven-seat (including pilot) ducted-fan electric jet designed for regional
  air mobility with target cruise speeds around 175 mph and ranges in excess
  of 100 nautical miles. Lilium pursued concurrent EASA and FAA Type
  Certification and signed pre-orders with operators across Europe, the Middle
  East, the United States, Brazil, and Saudi Arabia. In October 2024 Lilium's
  board approved self-administration for its German subsidiaries after failing
  to secure a guarantee for a EUR 50 million Bavarian government loan, and in
  December 2024 the company ceased operations and laid off approximately 1,000
  employees. A consortium called Mobile Uplift Corporation GmbH announced a
  partial asset acquisition in late December 2024, but in February 2025
  Lilium's German entities filed a second insolvency after the promised
  takeover financing failed to materialize. As of this profile (May 2026)
  Lilium remains non-operational and the website and social channels may be
  intermittently available; this profile is preserved for historical and
  archival reference.
